const confettiHTML=()=>{let h='<div class="confetti">';const cs=['#e31b1b','#ffd000','#3aa0ff','#3cb44b','#111'];for(let i=0;i<46;i++)h+=`<i style="left:${Math.random()*100}%;background:${rnd(cs)};animation-duration:${2+Math.random()*3}s;animation-delay:${-Math.random()*4}s"></i>`;return h+'</div>'};
// ---------- UI helpers ----------
function say(t){bubble.innerHTML=t||'';bubble.hidden=!t;bubble.classList.remove('pop');void bubble.offsetWidth;bubble.classList.add('pop')}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2300)}
(function(){const parts=[["Don't Press",'tr'],['the','tthe'],['Button','tb']];let i=0,h='';parts.forEach(([s,cl],pi)=>{if(pi)h+=' ';h+=`<span class="${cl}">`;for(const ch of s){const id=i++;if(ch===' '){h+=' ';continue}let d=id;if(ch==='o'&&cl==='tr')d='o1';if(ch==='o'&&cl==='tb')d='o2';h+=`<span class="ch" data-id="${d}">${ch==="'"?'&rsquo;':ch}</span>`}h+='</span>'});$('#title').innerHTML=h})();
// ---------- engine ----------
const G={li:0,c:null,lastWon:-1};const attempts={};let vnow=0;
const GENERIC=["You pressed it. Of course you did.","Bold strategy. Didn't work.","The button thanks you. I don't.","Wow. Just... wow.","That's not it, chief.","My grandma solves this faster. She's a cat."];
const isPaused=()=>!$('#modal').hidden||!$('#adOv').hidden||!$('#menuOv').hidden||!$('#endOv').hidden;
function fire(n,...a){const c=G.c;if(!c||c.done||!c.hooks[n])return false;c.hooks[n](...a);return true}
function makeBtn(){const b=document.createElement('button');b.className='bigbtn';b.setAttribute('aria-label','The button');b.innerHTML='<span class="base"></span><span class="side"></span><span class="top"><span class="lbl"></span></span>';b.addEventListener('contextmenu',e=>e.preventDefault());return b}
function ctx(i){
  const c={i,s:{},timers:[],offs:[],hooks:{},done:false,t0:vnow,attempts:attempts[i]||0,stage,narr};
  c.btn=makeBtn();stage.appendChild(c.btn);
  c.on=(t,e,f,o)=>{t.addEventListener(e,f,o);c.offs.push(()=>t.removeEventListener(e,f,o))};

  c.every=(ms,fn)=>{const t={at:vnow+ms,fn,ev:ms};c.timers.push(t);return t};

  c.hook=(n,f)=>{c.hooks[n]=f};

  c.fail=m=>{if(c.done||G.c!==c)return;c.done=true;failed(c,m)};

  c.press=()=>c.btn.click();

      end(){if(!st)return;const s=st;st=null;if(!c.done&&o.end)o.end(s.nx??s.ex,s.ny??s.ey,s.m,s);el.classList.remove('dragging')}};

function tick(dt){vnow+=dt;const c=G.c;if(!c||c.done)return;for(const tm of c.timers.slice()){let g=0;while(!tm.dead&&tm.at<=vnow&&!c.done&&G.c===c&&g++<200){if(tm.ev)tm.at+=tm.ev;else tm.dead=true;tm.fn()}}c.timers=c.timers.filter(t=>!t.dead)}

function closeAll(){$('#modal').hidden=true;$('#menuOv').hidden=true;$('#endOv').hidden=true}

function modal(h){$('#modalBox').innerHTML=h;$('#modal').hidden=false}

  modal(`<div class="mh win">${rnd(['NAILED IT','NICE!','GENIUS?','OKAY WOW','YOU DID IT'])}</div><p>${m||'Huh. It worked.'}</p><button class="big" id="nextBtn">${last?'See the ending':'Next level'} &rarr;</button>`);

// ---------- ads (STUBS) ----------
// Replace showAd with a portal SDK when publishing, e.g. CrazyGames:

    if(n<=0)$('#adClose').onclick=()=>{ov.hidden=true;onDone&&onDone()}};

const LEVELS=[
{t:`<span class=r>Don't</span> press the button.`,s:`Simple. Even you can do this.`,hint:`Do absolutely nothing for 5 seconds. Hands off.`,

{t:`Okay. <span class=r>NOW</span> press the button.`,s:`Go on. I won't judge.`,hint:`It's exactly what it says. For once.`,

$('#menuBtn').onclick=openMenu;$('#menuClose').onclick=()=>{$('#menuOv').hidden=true;if(!G.c)startLevel(S.cur)};

$('#timerBtn').onclick=()=>{if(isPaused())return;if(!fire('timer'))toast("That's your total play time. Embarrassing.")};
$('#muteBtn').onclick=()=>{S.muted=!S.muted;ac();if(master)master.gain.value=S.muted?0:.5;persist();hud();fire('mute',S.muted)};
let lastT=performance.now(),saveAcc=0;
setInterval(()=>{const t=performance.now(),dt=Math.min(250,t-lastT);lastT=t;if(isPaused()||!G.c)return;tick(dt);if(!document.hidden){S.time+=dt/1000;$('#timerBtn').textContent=fmt(S.time);saveAcc+=dt;if(saveAcc>5000){saveAcc=0;persist()}}},40);
// test hook (used by automated tests; harmless for players)
window.__test={N,go:i=>startLevel(i),solve:()=>LEVELS[G.li].solve(G.c,{G,retry:()=>startLevel(G.li)}),advance,retry:()=>startLevel(G.li),
 state:()=>({li:G.li,lastWon:G.lastWon,done:G.c?G.c.done:null,deaths:S.deaths,unlocked:S.unlocked,cur:S.cur,ended:!$('#endOv').hidden,modal:!$('#modal').hidden,ad:!$('#adOv').hidden}),
 set fastAds(v){T.fastAds=!!v},get fastAds(){return T.fastAds},save:()=>JSON.parse(JSON.stringify(S))};
startLevel(Math.min(S.cur||0,S.unlocked-1));
</script>
